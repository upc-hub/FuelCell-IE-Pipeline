# Create this environment on mercury (internet access, ChromeDriver available):
#   conda env create -f environment.yml
#   conda activate fuelcell-ie
#
# Then install PyTorch separately (see README Step 4).
# The environment is accessible on all mounted machines (htcat, htcatg02).
name: fuelcell-ie
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.7
  - pip
  - pip:
      # ── Core NLP framework (DyGIE++ inference) ────────────────────────────
      - allennlp==1.1.0
      - allennlp-models==1.1.0
      - jsonnet==0.20.0
      - overrides==3.1.0
      - conllu==4.1
      - word2number==1.1
      - py-rouge==1.1
      - plac==1.1.3
      - pysbd==0.3.4

      # ── PyTorch — install AFTER conda env create (see README Step 4) ──────
      # CPU only (no CUDA conflicts, works on any machine):
      #   pip install torch==1.13.1+cpu torchvision==0.14.1+cpu torchaudio==0.13.1+cpu
      #       -f https://download.pytorch.org/whl/torch_stable.html
      # GPU (CUDA 11.7 only — for faster Part 2 inference):
      #   pip install torch==1.13.1+cu117 torchvision==0.14.1+cu117 torchaudio==0.13.1+cu117
      #       -f https://download.pytorch.org/whl/torch_stable.html

      # ── Transformers / embeddings ─────────────────────────────────────────
      - transformers==3.0.2
      - tokenizers==0.8.1rc1
      - sentencepiece==0.2.0
      - sacremoses==0.0.53
      - regex==2024.4.16

      # ── spaCy stack — pinned to exact versions from htcat dygiepp env ─────
      # Confirmed working with Python 3.7 + allennlp 1.1.0 + spacy 2.3.1
      - murmurhash==1.0.10
      - cymem==2.0.8
      - preshed==3.0.9
      - blis==0.4.1
      - thinc==7.4.1
      - catalogue==1.0.2
      - srsly==1.0.7
      - wasabi==0.10.1
      - spacy==2.3.1
      - nmslib==2.1.1
      - scispacy==0.2.5
      # Language models installed separately (see README Step 5):
      #   en_core_web_sm-2.3.1  — used by cde_n (RSC scraper)
      #   en_core_sci_lg-0.3.0  — used by predict.py (scientific tokenisation)

      # ── cde_n (ChemdataExtractor v2.3.2 fork) dependencies ──────────────────
      - deprecation==2.1.0
      - yaspin==2.4.0
      - dawg-patched==0.9.1
      - tabledataextractor==1.5.11
      - pdfminer.six==20220524
      - python-crfsuite==0.9.10
      - appdirs==1.4.4
      - cssselect==1.2.0
      - stanza==1.6.1
      - emoji==2.14.1
      - six==1.16.0

      # ── RSC scraping (scrape_rsc.py) ──────────────────────────────────────
      - chromedriver-autoinstaller==0.6.4
      - selenium==3.141.0
      - requests==2.31.0
      - beautifulsoup4>=4.12.0
      - lxml==5.3.0

      # ── Hugging Face (model download) ─────────────────────────────────────
      - huggingface-hub==0.16.4

      # ── Data processing ───────────────────────────────────────────────────
      - numpy==1.21.6
      - pandas==0.25.2
      - scikit-learn==1.0.2
      - scipy==1.7.3

      # ── Utilities ─────────────────────────────────────────────────────────
      - nltk==3.8.1
      - ftfy==6.1.1
      - tqdm==4.67.0
      - pyyaml==6.0.1
      - tensorboardX==2.6.2.2
      - optuna==4.0.0
      - filelock==3.0.12
      - boto3==1.33.13
      - h5py==3.8.0
      - jsonpickle==3.4.2
      - packaging==24.0
      - click==8.1.7
      - six==1.16.0
      - joblib==1.3.2
      - importlib-metadata==6.7.0
      - importlib-resources==5.12.0
      - protobuf==4.24.4
      - SQLAlchemy==2.0.36
